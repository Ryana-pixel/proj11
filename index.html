
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela</title>

    <!-- Estilos e cores da página -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #171923;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #e879f9;
            text-align: center;
        }

        hr {
            border: 1px solid #a855f7;
            margin-bottom: 25px;
        }

        fieldset {
            border: 2px solid #a855f7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #242538;
        }

        legend {
            color: #f0abfc;
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            color: #f3e8ff;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #c084fc;
            border-radius: 6px;
            background-color: #fdf4ff;
            color: #272033;
        }

        input[type="radio"] {
            accent-color: #d946ef;
        }

        input[type="submit"] {
            background-color: #a855f7;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 11px 22px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #d946ef;
        }

        select:focus,
        input:focus {
            outline: 2px solid #e879f9;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- Título principal -->
    <h1>Minha primeira tabela</h1>
    <hr>

    <!-- Formulário com dados do cliente -->
    <fieldset>
        <legend>Dados do cliente</legend>

        <form action="#" method="post">
            <label for="nome">Nome:</label><br>
            <input type="text" name="nome" id="nome"
                    placeholder="Digite seu nome" required>

            <br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" name="email" id="email"
                    placeholder="Digite seu e-mail" required>

            <br><br>

            <label for="telefone">Telefone:</label><br>
            <input type="tel" name="telefone" id="telefone"
                    placeholder="Digite seu telefone">

            <br><br>

            <input type="submit" value="Enviar">
        </form>
    </fieldset>

    <!-- Configuração de hardware -->
    <fieldset>
        <legend>Configuração de hardware</legend>

        <label for="gpu">Escolha sua placa de vídeo:</label>

        <p>
            <select name="gpu" id="gpu" required>
                <option value="">Selecione uma GPU</option>
                <option value="gtx1060">NVIDIA GTX 1060</option>
                <option value="gtx1070">NVIDIA GTX 1070</option>
                <option value="gtx1080">NVIDIA GTX 1080</option>
            </select>
        </p>

        <p>Qual será o principal objetivo do computador?</p>

        <input type="radio" name="objetivo" id="jogos"
                value="jogos" checked>
        <label for="jogos">Jogos</label><br>

        <input type="radio" name="objetivo" id="streaming"
                value="streaming">
        <label for="streaming">Streaming</label><br>

        <input type="radio" name="objetivo" id="trabalho"
                value="trabalho">
        <label for="trabalho">Edição de vídeos</label>
    </fieldset>

</body>
</html>
